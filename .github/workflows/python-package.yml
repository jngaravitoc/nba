# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
    - name: Lint with flake8
      run: |
        # stop the build on Python syntax errors
        flake8 . --count --select=E9,F63,F7 --show-source --statistics
        # undefined names (F82) are known issues in density_tools.py and kinematics.py;
        # report them as warnings until those are cleaned up
        flake8 . --count --exit-zero --select=F82 --statistics
    - name: Test with pytest
      run: |
        pytest
